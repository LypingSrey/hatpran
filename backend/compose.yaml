# Local development database (PostgreSQL 17).
#
# - Credentials come from this folder's .env (DB_DATABASE, DB_USERNAME, DB_PASSWORD, DB_PORT).
# - Data lives in the "hatpran-pgsql" Docker volume, so it survives restarts and `docker compose down`.
#   Only `docker compose down -v` deletes it.
# - `restart: unless-stopped` makes Docker start the database automatically whenever Docker starts,
#   unless you stopped it yourself with `docker compose stop`.
#
# First start:   docker compose up -d --wait
# Connect with:  postgresql://<DB_USERNAME>:<DB_PASSWORD>@127.0.0.1:<DB_PORT>/<DB_DATABASE>
#
# Tests use a separate throwaway database (compose.testing.yaml, port 54329) and never touch this one.
services:
  pgsql:
    image: postgres:17-alpine
    container_name: hatpran-pgsql
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hatpran}
      POSTGRES_USER: ${DB_USERNAME:-hatpran}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-54320}:5432"
    volumes:
      - hatpran-pgsql:/var/lib/postgresql/data
    # Come back up automatically after a reboot / Docker restart.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  hatpran-pgsql:
